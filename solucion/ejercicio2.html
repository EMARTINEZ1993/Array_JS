
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de números</title>
</head>
<body>

    <h1>Operaciones con Arrays</h1>

    <form id="formulario">
        <input type="number" id="numero" placeholder="Ingrese un número">
        <button type="submit" id="btnAgregar">Agregar número</button>
    </form>

    <h2>Números registrados</h2>

    <ul id="lista"></ul>

    <h3>Resultados</h3>

    <p id="suma"></p>
    <p id="promedio"></p>
    <p id="mayor"></p>
    <p id="menor"></p>

    <script src="js/app2.js"></script>
</body>
</html>
